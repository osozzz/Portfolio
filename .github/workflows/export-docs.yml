name: Export portfolio documentation

on:
  push:
    branches:
      - export/portfolio-documentation-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4

      - name: Build documentation ZIP
        run: |
          zip -r Portfolio-Documentation-2026-10-15.zip             PORTFOLIO-OVERVIEW.md             docs             README.md             CONTRIBUTING.md             SECURITY.md             MANIFEST.json

      - name: Upload documentation package
        uses: actions/upload-artifact@v4
        with:
          name: Portfolio-Documentation-2026-10-15
          path: Portfolio-Documentation-2026-10-15.zip
          if-no-files-found: error
          retention-days: 7
