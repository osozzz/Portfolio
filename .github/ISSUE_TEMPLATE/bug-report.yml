name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Route, browser/device, viewport, release/commit, and relevant settings.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, recordings, logs with sensitive data removed, or failing test references.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: User impact, security/privacy impact, regression scope, and workaround if known.
