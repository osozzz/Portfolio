name: Decision proposal
description: Propose a change to an approved product, interface, technical, security, or delivery contract.
title: "[Decision] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / decision required
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current approved contract
      description: Cite the relevant DOC/ADR and summarize the current decision.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Evaluation criteria
      description: Product, UX, accessibility, security, privacy, cost, performance, operations, reversibility, etc.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact if changed
      description: List documents, code, migrations, releases, tests, and operations affected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: Prototype, benchmark, external docs, QA result, or other proof needed before deciding.
